<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff5f8" />
    <meta name="description" content="Rashi Chugh — Graphic Designer, Video Editor and Motion Graphic Designer. Explore selected creative work, experience and ways to connect." />
    <meta property="og:title" content="Rashi Chugh — Graphic Designer & Visual Storyteller" />
    <meta property="og:description" content="A creative portfolio of graphic design, video editing and motion graphics." />
    <meta property="og:type" content="website" />
    <title>Rashi Chugh — Graphic Designer & Visual Storyteller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  </head>
  <body>
    <script>
      try {
        const savedTheme = localStorage.getItem('rashi-portfolio-theme');
        const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : preferredTheme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
